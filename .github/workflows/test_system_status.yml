name: Run System Status Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env: # temporary CA mitigation
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Prepare Ubuntu CA trust
      uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

    - name: Set up Python 3.12
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with:
        python-version: 3.14

    - name: Install dependencies
      run: |
        cd system_status
        python -m pip install --upgrade pip
        pip install -r requirements_for_system_status.txt

    - name: Run tests
      run: |
        cd system_status
        pytest -v tests/*