name: Test public ECR authentication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  STAGING_ACCOUNT_ID: "239043911459"
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:latest
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  test-public-ecr:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Configure AWS credentials for public ECR using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.STAGING_ACCOUNT_ID }}:role/notification-lambdas-plan
          role-session-name: NotifyLambdasGitHubActions
          aws-region: "us-east-1"

      - name: Login to public ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1.7.1
        with:
          registry-type: public

      - name: Pull Trivy Docker image from public ECR
        run: docker pull "$TRIVY_IMAGE"

      - name: Download Trivy databases from configured repositories
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ vars.TRIVY_JAVA_DB_REPOSITORY }}
        run: |
          : "${TRIVY_DB_REPOSITORY:?Set the TRIVY_DB_REPOSITORY Actions variable}"
          : "${TRIVY_JAVA_DB_REPOSITORY:?Set the TRIVY_JAVA_DB_REPOSITORY Actions variable}"
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e TRIVY_DB_REPOSITORY \
            "$TRIVY_IMAGE" image --download-db-only
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e TRIVY_JAVA_DB_REPOSITORY \
            "$TRIVY_IMAGE" image --download-java-db-only

      - name: Logout of public ECR
        if: always() && steps.login-ecr.outcome == 'success'
        run: docker logout "${{ steps.login-ecr.outputs.registry }}"
